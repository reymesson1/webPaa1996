version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docintel_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=docintel-super-secret-production-jwt-key-2026
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEFAULT_PROMPT_VERSION=v2
      - ENABLE_PII_REDACTION=true
      - DATA_PATH=/app/.data
    volumes:
      - backend_data:/app/.data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - docintel_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docintel_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - docintel_net

  # Production vector database ready for PostgreSQL + pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docintel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docintel_admin
      POSTGRES_PASSWORD: docintel_secure_password_2026
      POSTGRES_DB: docintel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel_admin -d docintel_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docintel_net

volumes:
  backend_data:
  pgdata:

networks:
  docintel_net:
    driver: bridge
